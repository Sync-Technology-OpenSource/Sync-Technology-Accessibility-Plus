<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Sync Technology - Accessibility Plus</title>
    <style>
        :root {
            --st-blue-primary: #00A8FF;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            width: 280px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 14px;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .header img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .header h3 {
            font-size: 13px;
            margin: 0;
            color: var(--text);
            font-weight: 700;
        }

        .header span {
            font-weight: 400;
            color: var(--st-blue-primary);
            font-size: 11px;
        }

        .section-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--st-blue-primary);
            margin: 10px 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--st-blue-primary);
            cursor: pointer;
        }

        select {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        button {
            width: 100%;
            margin-bottom: 6px;
            padding: 8px 10px;
            cursor: pointer;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #2563eb;
            border-color: var(--st-blue-primary);
            color: #ffffff;
        }

        #btn-reset {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
            font-weight: 600;
            margin-top: 10px;
            justify-content: center;
        }

        #btn-reset:hover {
            background: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icons/icon.png" alt="Sync Technology Logo">
        <div>
            <h3>Sync Technology</h3>
            <span>Accessibility Plus</span>
        </div>
    </div>

    <div class="section-title">Visibilité & Confort</div>
    <button id="btn-contrast"><span>🌓</span> Mode Contraste</button>
    <button id="btn-underline"><span>🔗</span> Souligner les liens</button>
    <button id="btn-dyslexic"><span>📖</span> Police Dyslexique</button>

    <div class="section-title">Ajustements Avancés</div>

    <div class="control-group">
        <div class="control-label">
            <span>Taille du texte</span>
            <span id="text-size-value">100%</span>
        </div>
        <input type="range" id="range-text-size" min="100" max="180" step="10" value="100">
    </div>

    <!-- Bouton pour activer le curseur -->
    <button id="btn-toggle-cursor"><span>🖱️</span> Activer le curseur XXL</button>

    <!-- Conteneur des tailles qui s'affiche dynamiquement -->
    <div class="control-group" id="cursor-options-container" style="display: none;">
        <div class="control-label">
            <span>Taille du curseur</span>
        </div>
        <select id="select-cursor-size">
            <option value="lg">Grand (L)</option>
            <option value="xl">Très Grand (XL)</option>
            <option value="xxl" selected>XXL (Maximum)</option>
        </select>
    </div>
    <div class="section-title">Audio & Assistance</div>
    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button id="btn-read-page" style="flex: 2;"><span>🔊 Lire la page</span></button>
        <select id="select-speech-rate"
            style="flex: 1; background: var(--st-bg-card); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px;">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
        </select>
    </div>
    <button id="btn-reset">🔄 Réinitialiser tout</button>

    <script src="popup.js"></script>
</body>

</html>
