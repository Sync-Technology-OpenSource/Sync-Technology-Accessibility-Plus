<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sync Technology - Accessibility Plus</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
        }

        body { 
            width: 260px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 14px; 
            margin: 0; 
            background: var(--bg); 
            color: var(--text);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        /* On force une taille propre et fixe pour le logo dans la popup */
        .header img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .header h3 { 
            font-size: 13px; 
            margin: 0; 
            color: var(--primary); 
            font-weight: 700;
            line-height: 1.2;
        }

        .header span {
            font-weight: 400; 
            color: #64748b; 
            font-size: 11px;
        }

        .section-title { 
            font-size: 10px; 
            font-weight: 700; 
            color: #94a3b8; 
            margin: 10px 0 6px 0; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        button { 
            width: 100%; 
            margin-bottom: 6px; 
            padding: 8px 10px; 
            cursor: pointer; 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 500; 
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease; 
        }

        button:hover { 
            background: #f1f5f9; 
            border-color: #cbd5e1;
            color: var(--accent);
        }

        #btn-reset { 
            background: #fef2f2; 
            color: #dc2626; 
            border-color: #fecaca; 
            font-weight: 600; 
            margin-top: 10px;
            justify-content: center;
        }
        
        #btn-reset:hover { 
            background: #fee2e2; 
            border-color: #f87171;
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icons/icon.png" alt="Sync Technology Logo">
        <div>
            <h3>Sync Technology</h3>
            <span>Accessibility Plus</span>
        </div>
    </div>
    
    <div class="section-title">Visibilité & Confort</div>
    <button id="btn-contrast"><span>🌓</span> Mode Contraste</button>
    <button id="btn-underline"><span>🔗</span> Souligner les liens</button>
    <button id="btn-cursor"><span>🖱️</span> Curseur XXL</button>
    
    <div class="section-title">Typographie</div>
    <button id="btn-increase"><span>➕</span> Agrandir le texte</button>
    <button id="btn-decrease"><span>➖</span> Réduire le texte</button>
    <button id="btn-dyslexic"><span>📖</span> Police Dyslexique</button>
    
    <button id="btn-reset">🔄 Réinitialiser tout</button>
    
    <script src="popup.js"></script>
</body>
</html>
